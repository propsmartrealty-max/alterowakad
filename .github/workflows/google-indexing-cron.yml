name: Google Indexing & Search Engine Notification Workflow

on:
  push:
    branches:
      - main
  schedule:
    # Run daily at 04:00 UTC (09:30 AM IST)
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  ping-search-engines:
    name: Ping Google & IndexNow Engines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ping Googlebot Sitemap Notification Endpoint
        run: |
          echo "Submitting sitemap to Googlebot ping endpoint..."
          SITEMAP_URL="https://lodhaaltero.newlaunches.in/sitemap.xml"
          curl -s -I "https://www.google.com/ping?sitemap=${SITEMAP_URL}" || echo "Google ping completed"
          curl -s -I "https://www.google.com/ping?sitemap=https://lodhaaltero.newlaunches.in/sitemap-articles.xml" || echo "Articles sitemap ping completed"
          curl -s -I "https://www.google.com/ping?sitemap=https://lodhaaltero.newlaunches.in/sitemap-images.xml" || echo "Images sitemap ping completed"

      - name: Ping Bing IndexNow Endpoint
        run: |
          echo "Submitting URLs to Bing IndexNow..."
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "lodhaaltero.newlaunches.in",
              "key": "lodhaaltero2026indexnow",
              "keyLocation": "https://lodhaaltero.newlaunches.in/indexnow-key.txt",
              "urlList": [
                "https://lodhaaltero.newlaunches.in/",
                "https://lodhaaltero.newlaunches.in/sitemap.xml",
                "https://lodhaaltero.newlaunches.in/sitemap-articles.xml",
                "https://lodhaaltero.newlaunches.in/sitemap-images.xml",
                "https://lodhaaltero.newlaunches.in/articles/lodha-altero-wakad-price-list-cost-sheet-2026",
                "https://lodhaaltero.newlaunches.in/articles/lodha-altero-connectivity-hinjewadi-phoenix-mall",
                "https://lodhaaltero.newlaunches.in/articles/lodha-pune-residential-ecosystem",
                "https://lodhaaltero.newlaunches.in/articles/wakad-real-estate-investment-thesis-2026",
                "https://lodhaaltero.newlaunches.in/articles/wakad-vs-baner-vs-mahalunge-hinjewadi",
                "https://lodhaaltero.newlaunches.in/articles/lodha-altero-floor-plans-sky-duplex-penthouses",
                "https://lodhaaltero.newlaunches.in/articles/maharera-p52100079692-statutory-compliance",
                "https://lodhaaltero.newlaunches.in/articles/25000-sqft-rooftop-sky-club-infinity-pool",
                "https://lodhaaltero.newlaunches.in/articles/pune-real-estate-macro-trends-east-vs-west"
              ]
            }' || echo "IndexNow submission completed"
