name: Google Indexing & Search Engine Notification Workflow

on:
  push:
    branches:
      - main
  schedule:
    # Run daily at 04:00 UTC (09:30 AM IST)
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  ping-search-engines:
    name: Ping Google & IndexNow Engines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ping Googlebot Sitemap Notification Endpoint
        run: |
          echo "Submitting all sitemaps to Googlebot ping endpoints..."
          curl -s -I "https://www.google.com/ping?sitemap=https://altero.newlaunches.in/sitemap.xml" || echo "Master sitemap ping completed"
          curl -s -I "https://www.google.com/ping?sitemap=https://altero.newlaunches.in/sitemap-articles.xml" || echo "Articles sitemap ping completed"
          curl -s -I "https://www.google.com/ping?sitemap=https://altero.newlaunches.in/sitemap-programmatic.xml" || echo "Programmatic sitemap ping completed"
          curl -s -I "https://www.google.com/ping?sitemap=https://altero.newlaunches.in/sitemap-images.xml" || echo "Images sitemap ping completed"

      - name: Ping Edge IndexNow Dispatcher
        run: |
          echo "Calling Edge IndexNow Dispatcher on altero.newlaunches.in..."
          curl -s "https://altero.newlaunches.in/_edge/ping-index" | jq . || curl -s "https://altero.newlaunches.in/_edge/ping-index"

      - name: Direct Bing IndexNow Batch Submission
        run: |
          echo "Submitting core and programmatic URLs to Bing IndexNow..."
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "altero.newlaunches.in",
              "key": "e9a3b8c7d6e54f3a2b1c0d9e8f7a6b5c",
              "keyLocation": "https://altero.newlaunches.in/e9a3b8c7d6e54f3a2b1c0d9e8f7a6b5c.txt",
              "urlList": [
                "https://altero.newlaunches.in/",
                "https://altero.newlaunches.in/sitemap.xml",
                "https://altero.newlaunches.in/sitemap-articles.xml",
                "https://altero.newlaunches.in/sitemap-programmatic.xml",
                "https://altero.newlaunches.in/sitemap-images.xml",
                "https://altero.newlaunches.in/residences/3-bhk-luxury-wakad",
                "https://altero.newlaunches.in/residences/4-bhk-luxury-wakad",
                "https://altero.newlaunches.in/pricing/lodha-wakad-cost-sheet",
                "https://altero.newlaunches.in/transit/hinjewadi-it-park-commute",
                "https://altero.newlaunches.in/compare/lodha-altero-vs-godrej-wakad",
                "https://altero.newlaunches.in/articles/lodha-altero-wakad-price-list-cost-sheet-2026",
                "https://altero.newlaunches.in/articles/lodha-altero-connectivity-hinjewadi-phoenix-mall",
                "https://altero.newlaunches.in/articles/lodha-pune-residential-ecosystem",
                "https://altero.newlaunches.in/articles/wakad-real-estate-investment-thesis-2026",
                "https://altero.newlaunches.in/articles/wakad-vs-baner-vs-mahalunge-hinjewadi",
                "https://altero.newlaunches.in/articles/lodha-altero-floor-plans-sky-duplex-penthouses",
                "https://altero.newlaunches.in/articles/maharera-p52100079692-statutory-compliance",
                "https://altero.newlaunches.in/articles/25000-sqft-rooftop-sky-club-infinity-pool",
                "https://altero.newlaunches.in/articles/pune-real-estate-macro-trends-east-vs-west"
              ]
            }' || echo "IndexNow submission completed"
